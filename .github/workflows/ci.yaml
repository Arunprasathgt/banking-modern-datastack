name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Check Python code with Ruff
        run: ruff check .

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Create CI dbt profile
        run: |
          mkdir -p ~/.dbt
          cp banking_dbt/profiles.yml.example ~/.dbt/profiles.yml

      - name: Parse dbt project
        run: |
          dbt parse \
            --no-partial-parse \
            --project-dir banking_dbt \
            --profiles-dir ~/.dbt

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet